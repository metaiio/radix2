# Builds the pics.me Android debug APK and an iOS simulator build.
# Run it by hand from the Actions tab (it does not run on every push).
name: pics.me mobile builds

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: pics-me

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - run: npm run mobile:sync
      - run: ./gradlew assembleDebug
        working-directory: pics-me/android
      - uses: actions/upload-artifact@v4
        with:
          name: pics-me-android-debug
          path: pics-me/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - run: npm run mobile:sync
      - run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
        working-directory: pics-me/ios/App
